[phases.setup]
nixPkgs = ["nodejs", "npm"]
aptPkgs = [
  "libnss3",
  "libatk-bridge2.0-0",
  "libatk1.0-0",
  "libcups2",
  "libgbm1",
  "libasound2",
  "libpangocairo-1.0-0",
  "libxss1",
  "libgtk-3-0"
]

[phases.build]
cmds = ["npm install"]

[start]
cmd = "npm start"
[phases.setup]
nixPkgs = ["nodejs", "npm", "google-chrome"]

[phases.build]
cmds = ["npm install"]

[start]
cmd = "npm run migrate && npm start"
